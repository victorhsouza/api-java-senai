spring.application.name=segundaapi
# Caminho do banco de dados
spring.datasource.url = jdbc:mysql://localhost:3307/aula02
#usuario do banco de dados
spring.datasource.username = root

#Senha do banco de dados
spring.datasource.password=

#Coinfiguração para fazer alterações automaticamente no banco de dados
